# Cloudflare Worker config for the Scholar proxy.
# Deploy:  cd cloudflare && npx wrangler deploy
# See ../Deploy.md for the full walkthrough (incl. custom domain for China).

name = "scholar-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# --- Custom domain (recommended for mainland-China reachability) ---
# *.workers.dev is frequently polluted/blocked in China. Bind a route on a
# domain that lives in your own Cloudflare zone instead, then set that URL as
# the "Proxy endpoint" in the extension options.
#
# routes = [
#   { pattern = "scholar.example.com", custom_domain = true }
# ]
